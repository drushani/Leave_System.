<!--20260817: formatDuration(start, end)： 計算並回傳X天Y小時文字-->
<!--20260817: formatDateTime(dt)：把 2026-08-20T09:00 格式轉成 2026/08/20 09:00-->
<!--20260817: 表單欄位，把 type="date" 改成 type="datetime-local"-->
<!--20260817: 每次使用者「改動」開始時間或結束時間的選擇器，就會觸發一次 updateDaysNote()-->
<!--20260817: 請假紀錄卡片上顯示的日期時間，改用 formatDateTime() 和 formatDuration()-->
<!--20260817: 表單加了「附件」的檔案選擇欄位-->
<!--20260817: 新增偵測格式為何，以防檔案解析錯誤造成檔案損壞-->
<!--20260817: 新增FormData()，這種容器文字跟檔案都能裝-->
<!--20260817: 請假紀錄卡片上，有附件的話會顯示一個「*檔名」的下載連結-->
<!--20260818: api() 呼叫非 GET 請求時自動帶上 X-CSRF-Token 標頭，登入/me 回傳的 csrfToken 存進外層變數-->
<!--20260818: 帳號管理頁面顯示登入鎖定狀態，鎖定中可以按「解除登入鎖定」讓管理員手動解除-->

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>請假申請系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBFAF5; --paper-dim:#F2F0E7; --ink:#1E2A38; --ink-soft:#5B6472;
    --line:#D8D2C0; --brand:#2F5D62; --brand-dark:#204346;
    --stamp-approve:#3F7D4E; --stamp-pending:#C98A2C; --stamp-reject:#A63D40; --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'IBM Plex Sans', sans-serif; min-height:100vh;}
  .brandmark{font-family:'Fraunces', serif; font-weight:700; letter-spacing:0.02em;}
  .auth-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .auth-card{width:100%; max-width:420px; background:var(--white); border:1px solid var(--line); border-radius:2px; padding:40px 36px; box-shadow:0 1px 2px rgba(30,42,56,0.04), 0 8px 24px rgba(30,42,56,0.06); position:relative;}
  .auth-card::before{content:""; position:absolute; top:0;left:0;right:0; height:4px; background:var(--brand);}
  .form-title{font-family:'Fraunces', serif; font-size:26px; font-weight:600; margin:0 0 4px;}
  .form-sub{color:var(--ink-soft); font-size:13.5px; margin:0 0 28px;}
  label{display:block; font-size:12.5px; font-weight:500; color:var(--ink-soft); margin-bottom:6px; letter-spacing:0.02em;}
  .field{margin-bottom:16px;}
  input, select, textarea{width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:2px; background:var(--paper); font-family:'IBM Plex Sans', sans-serif; font-size:14px; color:var(--ink);}
  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--brand); box-shadow:0 0 0 3px rgba(47,93,98,0.12);}
  .btn{width:100%; padding:11px 16px; border:none; border-radius:2px; background:var(--brand); color:var(--white); font-size:14.5px; font-weight:600; cursor:pointer; font-family:'IBM Plex Sans', sans-serif;}
  .btn:hover{background:var(--brand-dark);}
  .btn:disabled{opacity:0.6; cursor:not-allowed;}
  .btn-ghost{background:transparent; color:var(--brand); border:1px solid var(--line);}
  .btn-ghost:hover{background:var(--paper-dim);}
  .btn-small{width:auto; padding:7px 14px; font-size:13px;}
  .switch-row{margin-top:20px; text-align:center; font-size:13.5px; color:var(--ink-soft);}
  .link{color:var(--brand); cursor:pointer; font-weight:600; text-decoration:underline;}
  .error-box{background:#FBEAEA; border:1px solid #E3B4B4; color:var(--stamp-reject); font-size:13px; padding:9px 12px; border-radius:2px; margin-bottom:16px;}
  .success-box{background:#EAF4EC; border:1px solid #B7D9BE; color:var(--stamp-approve); font-size:13px; padding:9px 12px; border-radius:2px; margin-bottom:16px;}
  .hint{font-size:11.5px; color:var(--ink-soft); margin-top:24px; border-top:1px solid var(--line); padding-top:14px; line-height:1.5;}
  .topbar{display:flex; align-items:center; justify-content:space-between; padding:16px 28px; background:var(--white); border-bottom:1px solid var(--line);}
  .topbar-user{display:flex; align-items:center; gap:12px; font-size:13.5px; color:var(--ink-soft);}
  .role-pill{font-size:11px; padding:2px 8px; border-radius:20px; background:var(--paper-dim); border:1px solid var(--line); font-family:'IBM Plex Mono', monospace;}
  .shell{display:flex; min-height:calc(100vh - 61px);}
  .sidebar{width:200px; flex-shrink:0; background:var(--white); border-right:1px solid var(--line); padding:20px 0;}
  .nav-item{padding:11px 24px; font-size:14px; color:var(--ink-soft); cursor:pointer; border-left:3px solid transparent;}
  .nav-item:hover{background:var(--paper-dim); color:var(--ink);}
  .nav-item.active{color:var(--brand); font-weight:600; border-left-color:var(--brand); background:var(--paper-dim);}
  .main{flex:1; padding:32px 40px; max-width:920px;}
  .page-title{font-family:'Fraunces', serif; font-size:24px; font-weight:600; margin:0 0 6px;}
  .page-sub{color:var(--ink-soft); font-size:13.5px; margin:0 0 28px;}
  .panel{background:var(--white); border:1px solid var(--line); border-radius:2px; padding:28px; max-width:560px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .days-note{font-size:12.5px; color:var(--brand); font-family:'IBM Plex Mono', monospace; margin-top:-8px; margin-bottom:16px;}
  .ledger-card{background:var(--white); border:1px solid var(--line); border-radius:2px; padding:20px 22px; margin-bottom:14px;}
  .ledger-top{display:flex; justify-content:space-between; align-items:center; gap:16px;}
  .ledger-type{font-family:'Fraunces', serif; font-size:17px; font-weight:600; margin:0 0 4px;}
  .ledger-meta{font-size:12.5px; color:var(--ink-soft); font-family:'IBM Plex Mono', monospace;}
  .ledger-reason{font-size:13.5px; color:var(--ink); margin-top:10px; line-height:1.5;}
  .ledger-applicant{font-size:12px; color:var(--ink-soft); margin-top:4px;}
  .stamp{font-family:'IBM Plex Mono', monospace; font-size:11.5px; font-weight:600; letter-spacing:0.08em; padding:6px 10px; border:2px dashed currentColor; border-radius:6px; transform:rotate(-6deg); white-space:nowrap; flex-shrink:0;}
  .stamp-pending{color:var(--stamp-pending);} .stamp-approved{color:var(--stamp-approve);} .stamp-rejected{color:var(--stamp-reject);}
  .review-actions{display:flex; gap:10px; margin-top:14px;}
  .btn-approve{background:var(--stamp-approve);} .btn-approve:hover{background:#356a42;}
  .btn-reject{background:var(--stamp-reject);} .btn-reject:hover{background:#8a3235;}
  .empty-state{text-align:center; padding:60px 20px; color:var(--ink-soft);}
  .empty-state .brandmark{display:block; font-size:20px; margin-bottom:6px; color:var(--ink);}
  .loading{padding:40px; text-align:center; color:var(--ink-soft); font-size:13.5px;}
  .filter-tabs{display:flex; gap:8px; margin-bottom:20px;}
  .filter-tab{padding:6px 14px; font-size:12.5px; border:1px solid var(--line); border-radius:20px; cursor:pointer; color:var(--ink-soft); background:var(--white);}
  .filter-tab.active{background:var(--brand); color:var(--white); border-color:var(--brand);}
  .toolbar{display:flex; align-items:center; gap:14px; margin-bottom:18px; flex-wrap:wrap;}
  .toolbar label{margin:0; white-space:nowrap;}
  .toolbar select, .toolbar input[type=date]{width:auto;}
  .review-table{width:100%; border-collapse:collapse; background:var(--white); border:1px solid var(--line); font-size:13px;}
  .review-table th, .review-table td{padding:10px 12px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle;}
  .review-table th{background:var(--paper-dim); font-weight:600; color:var(--ink-soft); font-size:12px;}
  .review-table tr:last-child td{border-bottom:none;}
  .review-table .row-actions{display:flex; gap:8px;}
  .summary-note{font-size:13px; color:var(--ink-soft); margin-bottom:14px;}
  .summary-note b{color:var(--ink); font-family:'IBM Plex Mono', monospace;}
  @media (max-width:720px){
    .shell{flex-direction:column;} .sidebar{width:100%; display:flex; padding:8px; overflow-x:auto;}
    .nav-item{border-left:none; border-bottom:3px solid transparent; white-space:nowrap;}
    .nav-item.active{border-left:none; border-bottom-color:var(--brand);}
    .main{padding:20px;} .row2{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  "use strict";

  let CSRF_TOKEN = null; // 登入或 /api/me 成功時會拿到，之後每次寫入型請求都要附上，伺服器用它防 CSRF（跨站請求偽造）

  async function api(path, options){
    options = options || {};
    // 如果 body 是 FormData（例如包含檔案），不能手動設定 Content-Type，
    // 瀏覽器需要自己加上 multipart/form-data 的 boundary 才會正確送出。
    const isFormData = options.body instanceof FormData;
    const method = (options.method || "GET").toUpperCase();
    const headers = isFormData ? {} : {"Content-Type":"application/json"};
    // 非 GET 的請求（送出/審核/建立帳號…）才需要帶 CSRF token，登入前也還沒有 token 可以帶
    if(method !== "GET" && CSRF_TOKEN) headers["X-CSRF-Token"] = CSRF_TOKEN;
    const res = await fetch(path, Object.assign({
      headers,
      credentials: "same-origin"
    }, options));
    let data = {};
    try{ data = await res.json(); }catch(e){}
    if(!res.ok){
      // 401 代表「伺服器覺得你現在沒有登入」——可能是原本就沒登入、session 過期，
      // 或是帳號被管理員停用了（requireAuth 每次都會重新檢查一次帳號是不是還啟用中）。
      // 不管是哪一種，前端都應該直接把畫面切回登入頁，不要讓使用者卡在一個「看起來還登入著、但操作什麼都失敗」的畫面。
      if(res.status === 401){
        CSRF_TOKEN = null;
        state = Object.assign({}, state, {view:"login", currentUser:null});
        render();
      }
      throw new Error(data.error || "發生未知錯誤");
    }
    return data;
  }

  let state = { view:"login", currentUser:null, tab:"submit", error:"", notice:"", filter:"all" };
  const app = document.getElementById("app");

  function setState(patch){ state = Object.assign({}, state, patch); render(); }
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
  // 計算開始～結束之間總共多少小時，並格式化成「X 天 Y 小時」或「Y 小時」的文字
  function formatDuration(start,end){
    if(!start || !end) return "";
    const ms = new Date(end) - new Date(start);
    if(!(ms > 0)) return "";
    const totalHours = Math.round(ms / 3600000 * 10) / 10; // 四捨五入到小數第一位
    const days = Math.floor(totalHours / 24);
    const hours = Math.round((totalHours - days * 24) * 10) / 10;
    if(days > 0 && hours > 0) return `${days} 天 ${hours} 小時`;
    if(days > 0) return `${days} 天`;
    return `${hours} 小時`;
  }
  // 把 "2026-08-20T09:00" 這種格式轉成 "2026/08/20 09:00" 方便閱讀
  function formatDateTime(dt){
    if(!dt) return "";
    const d = new Date(dt);
    if(isNaN(d)) return dt;
    const pad = n => String(n).padStart(2,"0");
    return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  const LEAVE_TYPES = ["特休","病假","事假","婚假","喪假","其他"];
  const STATUS_LABEL = { pending:"待審核", approved:"已核准", rejected:"已拒絕", cancelled:"已取消" };
  const RANK = { employee:1, section_chief:2, deputy_manager:3, manager:4, general_manager:5, admin:6 };
  const ROLE_LABEL = { employee:"員工", section_chief:"課長", deputy_manager:"副經理/副廠長", manager:"經理/廠長", general_manager:"總經理", admin:"管理員" };
  const COMPANY_WIDE_ROLES = ["general_manager","admin"];
  let DEPARTMENTS = [];

  function renderLogin(){
    app.innerHTML = `
      <div class="auth-wrap"><div class="auth-card">
        <div class="brandmark form-title">請假申請系統</div>
        <p class="form-sub">登入你的帳號以提交或審核請假申請</p>
        ${state.error ? `<div class="error-box">${escapeHtml(state.error)}</div>` : ""}
        ${state.notice ? `<div class="success-box">${escapeHtml(state.notice)}</div>` : ""}
        <form id="login-form">
          <div class="field"><label>帳號</label><input type="text" id="login-username" autocomplete="username" required></div>
          <div class="field"><label>密碼</label><input type="password" id="login-password" autocomplete="current-password" required></div>
          <button class="btn" type="submit" id="login-btn">登入</button>
        </form>
        <div class="switch-row"><span class="link" id="forgot-pw-link">忘記密碼？</span></div>
        <div class="hint">帳號密碼會以雜湊方式儲存在你自己架設的資料庫中。如需帳號，請洽系統管理員建立。</div>
      </div></div>`;
    document.getElementById("login-form").onsubmit = async (e) => {
      e.preventDefault();
      const username = document.getElementById("login-username").value.trim();
      const password = document.getElementById("login-password").value;
      const btn = document.getElementById("login-btn");
      btn.disabled = true; btn.textContent = "登入中…";
      try{
        const { user, csrfToken } = await api("/api/login", { method:"POST", body: JSON.stringify({username,password}) });
        CSRF_TOKEN = csrfToken;
        if(user.mustChangePassword){
          setState({view:"app", currentUser:user, error:"", tab:"force-password"});
        } else {
          setState({view:"app", currentUser:user, error:"", tab:"submit"});
        }
      }catch(err){ setState({error: err.message}); }
    };
    document.getElementById("forgot-pw-link").onclick = () => setState({view:"forgot", error:"", notice:""});
  }

  // 忘記密碼：輸入帳號，系統會寄一封重設密碼信到綁定的信箱（不管帳號存不存在都顯示一樣的訊息，避免帳號列舉）
  function renderForgotPassword(){
    app.innerHTML = `
      <div class="auth-wrap"><div class="auth-card">
        <div class="brandmark form-title">忘記密碼</div>
        <p class="form-sub">輸入你的帳號，我們會寄一封重設密碼的信到你綁定的信箱。</p>
        ${state.error ? `<div class="error-box">${escapeHtml(state.error)}</div>` : ""}
        ${state.notice ? `<div class="success-box">${escapeHtml(state.notice)}</div>` : ""}
        <form id="forgot-pw-form">
          <div class="field"><label>帳號</label><input type="text" id="forgot-username" autocomplete="username" required></div>
          <button class="btn" type="submit" id="forgot-pw-btn">寄送重設密碼信</button>
        </form>
        <div class="switch-row"><span class="link" id="back-to-login-link">回到登入頁</span></div>
      </div></div>`;
    document.getElementById("back-to-login-link").onclick = () => setState({view:"login", error:"", notice:""});
    document.getElementById("forgot-pw-form").onsubmit = async (e) => {
      e.preventDefault();
      const username = document.getElementById("forgot-username").value.trim();
      const btn = document.getElementById("forgot-pw-btn");
      btn.disabled = true; btn.textContent = "寄送中…";
      try{
        const { message } = await api("/api/forgot-password", { method:"POST", body: JSON.stringify({username}) });
        setState({error:"", notice: message});
      }catch(err){
        setState({error: err.message, notice:""});
      }finally{
        btn.disabled = false; btn.textContent = "寄送重設密碼信";
      }
    };
  }

  // 使用者點擊信裡的重設連結進來的畫面（網址帶 ?resetToken=xxx）
  function renderResetPassword(){
    app.innerHTML = `
      <div class="auth-wrap"><div class="auth-card">
        <div class="brandmark form-title">設定新密碼</div>
        <p class="form-sub">請輸入你的新密碼。這個重設連結限時 15 分鐘內有效，且只能使用一次。</p>
        ${state.error ? `<div class="error-box">${escapeHtml(state.error)}</div>` : ""}
        <form id="reset-pw-form">
          <div class="field"><label>新密碼（至少 8 個字元，需包含英文字母與數字）</label><input type="password" id="reset-new" autocomplete="new-password" minlength="8" required></div>
          <div class="field"><label>再輸入一次新密碼</label><input type="password" id="reset-confirm" autocomplete="new-password" minlength="8" required></div>
          <button class="btn" type="submit" id="reset-pw-btn">更新密碼</button>
        </form>
        <div class="switch-row"><span class="link" id="back-to-login-link2">回到登入頁</span></div>
      </div></div>`;
    document.getElementById("back-to-login-link2").onclick = () => {
      history.replaceState(null, "", location.pathname);
      setState({view:"login", error:"", notice:""});
    };
    document.getElementById("reset-pw-form").onsubmit = async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById("reset-new").value;
      const confirm = document.getElementById("reset-confirm").value;
      if(newPassword !== confirm){ setState({error:"兩次輸入的新密碼不一致"}); return; }
      const btn = document.getElementById("reset-pw-btn");
      btn.disabled = true; btn.textContent = "更新中…";
      try{
        await api("/api/reset-password", { method:"POST", body: JSON.stringify({token: state.resetToken, newPassword}) });
        history.replaceState(null, "", location.pathname);
        setState({view:"login", error:"", notice:"密碼已更新，請用新密碼登入", resetToken:null});
      }catch(err){ setState({error: err.message}); }
    };
  }

  function renderShell(bodyHtml){
    const u = state.currentUser;
    const isReviewer = RANK[u.role] >= RANK.section_chief;
    app.innerHTML = `
      <div class="topbar">
        <div class="brandmark">請假申請系統</div>
        <div class="topbar-user">
          <span>${escapeHtml(u.name)}</span>
          <span class="role-pill">${escapeHtml(ROLE_LABEL[u.role] || u.role)}${u.department ? ` · ${escapeHtml(u.department)}` : ""}</span>
          <button class="btn btn-ghost btn-small" id="change-pw-btn">修改密碼</button>
          <button class="btn btn-ghost btn-small" id="logout-btn">登出</button>
        </div>
      </div>
      <div class="shell">
        <div class="sidebar">
          <div class="nav-item ${state.tab==='submit'?'active':''}" data-tab="submit">提交請假</div>
          <div class="nav-item ${state.tab==='mine'?'active':''}" data-tab="mine">我的紀錄</div>
          ${isReviewer ? `<div class="nav-item ${state.tab==='review'?'active':''}" data-tab="review">審核請假</div>` : ""}
          ${isReviewer ? `<div class="nav-item ${state.tab==='attendance'?'active':''}" data-tab="attendance">出勤查詢</div>` : ""}
          ${u.role === 'admin' ? `<div class="nav-item ${state.tab==='admin'?'active':''}" data-tab="admin">帳號管理</div>` : ""}
        </div>
        <div class="main">${bodyHtml}</div>
      </div>`;
    document.getElementById("logout-btn").onclick = async () => {
      await api("/api/logout", { method:"POST" });
      CSRF_TOKEN = null;
      setState({view:"login", currentUser:null, error:""});
    };
    document.getElementById("change-pw-btn").onclick = () => setState({tab:"change-password", error:"", notice:""});
    document.querySelectorAll(".nav-item").forEach(el=>{
      el.onclick = () => setState({tab: el.dataset.tab, error:"", notice:""});
    });
  }

  async function renderSubmitTab(){
    let balance = null;
    try{ balance = await api("/api/leaves/leave-balance"); }catch(e){}

    const bodyHtml = `
      <h1 class="page-title">提交請假申請</h1>
      <p class="page-sub">填寫以下表單送出你的請假申請，送出後將進入待審核狀態。</p>
      ${state.error ? `<div class="error-box">${escapeHtml(state.error)}</div>` : ""}
      ${state.notice ? `<div class="success-box">${escapeHtml(state.notice)}</div>` : ""}
      ${balance && balance.hireDate ? `<div class="days-note" style="margin-bottom:16px;">特休額度（依到職日 ${escapeHtml(balance.hireDate)} 自動計算）：總共 ${balance.totalHours} 小時，已使用（含待審核）${balance.usedHours} 小時，剩餘 ${balance.remainingHours} 小時</div>` : ""}
      ${balance && !balance.hireDate ? `<div class="days-note" style="margin-bottom:16px;">你的帳號尚未設定到職日，暫時無法計算特休額度，請聯繫管理員設定。</div>` : ""}
      <div class="panel">
        <form id="leave-form">
          <div class="field"><label>假別</label>
            <select id="leave-type">${LEAVE_TYPES.map(t=>`<option value="${t}">${t}</option>`).join("")}</select>
          </div>
          <div class="row2">
            <div class="field"><label>開始時間</label><input type="datetime-local" id="leave-start" required></div>

      const text = formatDuration(startEl.value, endEl.value);

    }
    startEl.onchange = updateDaysNote; endEl.onchange = updateDaysNote;

    document.getElementById("leave-form").onsubmit = async (e) => {
      e.preventDefault();
      const type = document.getElementById("leave-type").value;
      const start = startEl.value, end = endEl.value;
      const reason = document.getElementById("leave-reason").value.trim();
      const attachmentFile = document.getElementById("leave-attachment").files[0];
      const btn = document.getElementById("submit-leave-btn");
      btn.disabled = true; btn.textContent = "送出中…";
      try{
        const formData = new FormData();
        formData.append("type", type);
        formData.append("start", start);
        formData.append("end", end);
        formData.append("reason", reason);
        if(attachmentFile) formData.append("attachment", attachmentFile);
        await api("/api/leaves", { method:"POST", body: formData });
        setState({error:"", notice:"已送出申請，等待審核", tab:"submit"});
      }catch(err){ setState({error: err.message, notice:""}); }
    };
  }

    const nuDeptEl = document.getElementById("nu-department");
    function syncDeptRequirement(){
      const companyWide = COMPANY_WIDE_ROLES.includes(nuRoleEl.value);
      nuDeptField.style.display = companyWide ? "none" : "";
      nuDeptEl.required = !companyWide;
      if(companyWide) nuDeptEl.value = "";
    }
    nuRoleEl.onchange = syncDeptRequirement;
    syncDeptRequirement();

    document.getElementById("new-user-form").onsubmit = async (e) => {
      e.preventDefault();
      const name = document.getElementById("nu-name").value.trim();
      const username = document.getElementById("nu-username").value.trim();
      const password = document.getElementById("nu-password").value;
      const role = nuRoleEl.value;
      const department = nuDeptEl.value || null;
      const hireDate = document.getElementById("nu-hiredate").value || null;
      const email = document.getElementById("nu-email").value.trim() || null;
      const btn = document.getElementById("nu-btn");
      btn.disabled = true; btn.textContent = "建立中…";
      try{
        await api("/api/admin/users", { method:"POST", body: JSON.stringify({username,password,name,role,department,hireDate,email}) });
        setState({error:"", notice:`已建立帳號 "${username}"`, tab:"admin"});
      }catch(err){ setState({error: err.message, notice:""}); }
    };

    document.querySelectorAll(".reset-pw-btn").forEach(btn => {
      btn.onclick = async () => {
        const username = btn.dataset.username;
        const newPassword = prompt(`請輸入「${username}」的新密碼（至少 8 個字元，需包含英文字母與數字）`);
        
        if (newPassword === null) return; // 使用者按了取消
        
        try{
          await api(`/api/admin/users/${username}/password`, { 
            method:"POST", 
            body: JSON.stringify({newPassword}) });
          setState({error:"", notice:`已重設密碼 "${username}"`, tab:"admin"});
        }catch(err){ setState({error: err.message, notice:""}); }
      };
    });

    document.querySelectorAll(".set-dept-btn").forEach(btn => {
      btn.onclick = async () => {
        const username = btn.dataset.username;
        const department = prompt(`請輸入「${username}」的部門（${DEPARTMENTS.join("、")}；總經理／管理員可留空）`);
        if (department === null) return;
        try{
          await api(`/api/admin/users/${username}/department`, { method:"POST", body: JSON.stringify({department: department.trim()}) });
          setState({error:"", notice:`已設定「${username}」的部門`, tab:"admin"});
        }catch(err){ setState({error: err.message, notice:""}); }
      };
    });

    document.querySelectorAll(".set-hiredate-btn").forEach(btn => {
      btn.onclick = async () => {
        const username = btn.dataset.username;
        const hireDate = prompt(`請輸入「${username}」的到職日（格式 YYYY-MM-DD，例如 2024-03-01）\n特休天數會依這個日期自動重新計算。`);
        if (hireDate === null) return;
        try{
          await api(`/api/admin/users/${username}/hire-date`, { method:"POST", body: JSON.stringify({hireDate}) });
          setState({error:"", notice:`已設定「${username}」的到職日`, tab:"admin"});
        }catch(err){ setState({error: err.message, notice:""}); }
      };
    });

    document.querySelectorAll(".set-email-btn").forEach(btn => {
      btn.onclick = async () => {
        const username = btn.dataset.username;
        const email = prompt(`請輸入「${username}」的通知信箱（公司內部信箱或 Gmail 都可以，留空可清除）`);
        if (email === null) return;
        try{
          await api(`/api/admin/users/${username}/email`, { method:"POST", body: JSON.stringify({email: email.trim()}) });
          setState({error:"", notice:`已設定「${username}」的信箱`, tab:"admin"});
        }catch(err){ setState({error: err.message, notice:""}); }
      };
    });

    document.querySelectorAll(".unlock-login-btn").forEach(btn => {
      btn.onclick = async () => {
        const username = btn.dataset.username;
        btn.disabled = true;
        try{
          await api(`/api/admin/users/${username}/unlock-login`, { method:"POST" });
          setState({error:"", notice:`已解除「${username}」的登入鎖定`, tab:"admin"});
        }catch(err){ setState({error: err.message, notice:""}); }
      };
    });

    document.querySelectorAll(".toggle-active-btn").forEach(btn => {
      btn.onclick = async () => {
        const username = btn.dataset.username;
        const currentlyActive = btn.dataset.active === "1";
        const confirmMsg = currentlyActive
          ? `確定要停用「${username}」的帳號嗎？停用後這個帳號將無法登入，但過去的請假紀錄會保留。`
          : `確定要重新啟用「${username}」的帳號嗎？`;
        if (!confirm(confirmMsg)) return;
        btn.disabled = true;
        try{
          await api(`/api/admin/users/${username}/active`, { method:"POST", body: JSON.stringify({active: !currentlyActive}) });
          setState({error:"", notice:`已${currentlyActive ? "停用" : "啟用"}「${username}」的帳號`, tab:"admin"});
        }catch(err){ setState({error: err.message, notice:""}); }
      };
    });

    document.getElementById("import-btn").onclick = async () => {
      const fileInput = document.getElementById("import-file");
      const file = fileInput.files[0];
      if (!file) { setState({error:"請先選擇要匯入的 Excel 檔案", notice:""}); return; }

      const importBtn = document.getElementById("import-btn");
      importBtn.disabled = true; importBtn.textContent = "匯入中…";
      try{
        const formData = new FormData();
        formData.append("file", file);
        const result = await api("/api/admin/users/import", { method:"POST", body: formData });

        let notice = `匯入完成：新增 ${result.createdCount} 筆、更新 ${result.updatedCount} 筆、失敗 ${result.failedCount} 筆`;
        const defaultPwUsers = result.created.filter(c => c.usedDefaultPassword).map(c => c.username);
        if (defaultPwUsers.length) {
          notice += `。以下新帳號套用預設密碼「${result.defaultPassword}」，請提醒使用者登入後自行修改：${defaultPwUsers.join("、")}`;
        }
        let error = "";
        if (result.failed.length) {
          error = `匯入失敗 ${result.failed.length} 筆：` + result.failed.map(f => `第${f.row}列(${f.username})：${f.error}`).join("；");
        }
        // 匯入結束後重新整理整個管理頁面（含帳號列表），讓使用者馬上看到最新資料
        setState({error, notice, tab:"admin"});
      }catch(err){
        setState({error: err.message, notice:""});
      }
    };
  }

  function render(){
    if(state.view === "login") return renderLogin();
    if(state.view === "forgot") return renderForgotPassword();
    if(state.view === "reset") return renderResetPassword();
    if(state.view === "app"){
      // 帳號被標記「必須先改密碼」時，不管原本要去哪個分頁都先攔下來，只能改密碼或登出
      if(state.currentUser && state.currentUser.mustChangePassword && state.tab !== "force-password") {
        state.tab = "force-password";
      }
      if(state.tab === "force-password") return renderForcePasswordScreen();
      if(state.tab === "submit") return renderSubmitTab();
      if(state.tab === "mine") return renderMineTab();
      if(state.tab === "review") return renderReviewTab();
      if(state.tab === "attendance") return renderAttendanceTab();
      if(state.tab === "admin") return renderAdminTab();
      if(state.tab === "change-password") return renderChangePasswordTab();
    }
  }

  // 強制改密碼畫面：帳號密碼是別人（管理員／匯入 Excel）設定的，第一次登入要先換掉才能用系統其他功能。
  // 故意不套用 renderShell（沒有側邊欄），避免讓人以為可以繞去別的分頁——反正伺服器那邊寫入型操作也會被擋下來。
  function renderForcePasswordScreen(){
    const u = state.currentUser;
    app.innerHTML = `
      <div class="auth-wrap"><div class="auth-card">
        <div class="brandmark form-title">請先設定新密碼</div>
        <p class="form-sub">${escapeHtml(u.name)} 您好，這組密碼是管理員設定的，請先改成只有您自己知道的密碼，才能繼續使用系統。</p>
        ${state.error ? `<div class="error-box">${escapeHtml(state.error)}</div>` : ""}
        <form id="force-pw-form">
          <div class="field"><label>目前的密碼</label><input type="password" id="fpw-current" autocomplete="current-password" required></div>
          <div class="field"><label>新密碼（至少 8 個字元，需包含英文字母與數字）</label><input type="password" id="fpw-new" autocomplete="new-password" minlength="8" required></div>
          <div class="field"><label>再輸入一次新密碼</label><input type="password" id="fpw-confirm" autocomplete="new-password" minlength="8" required></div>
          <button class="btn" type="submit" id="fpw-btn">更新密碼並繼續</button>
        </form>
        <div class="switch-row"><span class="link" id="force-logout-link">登出</span></div>
      </div></div>`;
    document.getElementById("force-logout-link").onclick = async () => {
      await api("/api/logout", { method:"POST" });
      CSRF_TOKEN = null;
      setState({view:"login", currentUser:null, error:""});
    };
    document.getElementById("force-pw-form").onsubmit = async (e) => {
      e.preventDefault();
      const currentPassword = document.getElementById("fpw-current").value;
      const newPassword = document.getElementById("fpw-new").value;
      const confirm = document.getElementById("fpw-confirm").value;
      if(newPassword !== confirm){ setState({error:"兩次輸入的新密碼不一致"}); return; }
      const btn = document.getElementById("fpw-btn");
      btn.disabled = true; btn.textContent = "更新中…";
      try{
        const { user } = await api("/api/me/password", { method:"POST", body: JSON.stringify({currentPassword, newPassword}) });
        setState({currentUser:user, error:"", notice:"密碼已更新", tab:"submit"});
      }catch(err){ setState({error: err.message}); }
    };
  }

  // 一般使用者自己主動改密碼（從 topbar 的「修改密碼」進來，非強制情境），
  // 同一頁也讓使用者自己綁定／修改通知信箱（忘記密碼、審核通知都要寄到這個信箱）
  function renderChangePasswordTab(){
    const u = state.currentUser;
    const bodyHtml = `
      <h1 class="page-title">修改密碼</h1>
      <p class="page-sub">為了帳號安全，建議定期更換密碼，並避免使用其他網站也在用的密碼。</p>
      ${state.error ? `<div class="error-box">${escapeHtml(state.error)}</div>` : ""}
      ${state.notice ? `<div class="success-box">${escapeHtml(state.notice)}</div>` : ""}
      <div class="panel" style="margin-bottom:16px;">
        <h2 class="page-title" style="font-size:16px; margin-bottom:6px;">通知信箱</h2>
        <p class="page-sub" style="margin-bottom:16px;">用來接收忘記密碼、請假審核結果等系統通知，公司內部信箱或 Gmail 都可以。</p>
        <form id="change-email-form">
          <div class="field"><label>Email</label><input type="email" id="cem-email" value="${escapeHtml(u.email || "")}" placeholder="name@example.com"></div>
          <button class="btn btn-ghost" type="submit" id="cem-btn">儲存信箱</button>
        </form>
      </div>
      <div class="panel">
        <form id="change-pw-form">
          <div class="field"><label>目前的密碼</label><input type="password" id="cpw-current" autocomplete="current-password" required></div>
          <div class="field"><label>新密碼（至少 8 個字元，需包含英文字母與數字）</label><input type="password" id="cpw-new" autocomplete="new-password" minlength="8" required></div>
          <div class="field"><label>再輸入一次新密碼</label><input type="password" id="cpw-confirm" autocomplete="new-password" minlength="8" required></div>
          <button class="btn" type="submit" id="cpw-btn">更新密碼</button>
        </form>
      </div>`;
    renderShell(bodyHtml);
    document.getElementById("change-email-form").onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById("cem-email").value.trim();
      const btn = document.getElementById("cem-btn");
      btn.disabled = true; btn.textContent = "儲存中…";
      try{
        const { user } = await api("/api/me/email", { method:"POST", body: JSON.stringify({email}) });
        setState({currentUser:user, error:"", notice:"信箱已更新", tab:"change-password"});
      }catch(err){ setState({error: err.message, notice:""}); }
    };
    document.getElementById("change-pw-form").onsubmit = async (e) => {
      e.preventDefault();
      const currentPassword = document.getElementById("cpw-current").value;
      const newPassword = document.getElementById("cpw-new").value;
      const confirm = document.getElementById("cpw-confirm").value;
      if(newPassword !== confirm){ setState({error:"兩次輸入的新密碼不一致", notice:""}); return; }
      const btn = document.getElementById("cpw-btn");
      btn.disabled = true; btn.textContent = "更新中…";
      try{
        const { user } = await api("/api/me/password", { method:"POST", body: JSON.stringify({currentPassword, newPassword}) });
        setState({currentUser:user, error:"", notice:"密碼已更新", tab:"change-password"});
      }catch(err){ setState({error: err.message, notice:""}); }
    };
  }

  // check for an existing session on load (e.g. page refresh)
  (async function init(){
    // 使用者是從忘記密碼信裡的連結點進來的（網址帶 ?resetToken=xxx），直接進重設密碼畫面，不用先登入
    const urlParams = new URLSearchParams(location.search);
    const resetToken = urlParams.get("resetToken");
    if(resetToken){
      state.view = "reset"; state.resetToken = resetToken;
      render();
      return;
    }
    try{
      const { departments } = await api("/api/departments");
      DEPARTMENTS = departments || [];
    }catch(e){}
    try{
      const { user, csrfToken } = await api("/api/me");
      if(user){
        CSRF_TOKEN = csrfToken;
        state.view = "app"; state.currentUser = user;
        state.tab = user.mustChangePassword ? "force-password" : "submit";
      }
    }catch(e){}
    render();
  })();
})();
</script>
</body>
</html>
